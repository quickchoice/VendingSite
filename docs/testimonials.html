<style>
  /* ===== Auto Carousel (uses your brand tokens) ===== */
  .twrap{
    --edge-fade: 90px;             /* edge fade width */
    position:relative;
    max-width:1100px;
    margin:0 auto;
    padding:10px 0;
    /* Edge fading with mask (supported in modern browsers) */
    -webkit-mask-image: linear-gradient(to right, transparent, #000  var(--edge-fade), #000 calc(100% - var(--edge-fade)), transparent);
            mask-image: linear-gradient(to right, transparent, #000  var(--edge-fade), #000 calc(100% - var(--edge-fade)), transparent);
  }
  .tviewport{
    overflow:hidden;
  }
  .ttrack{
    display:flex; align-items:stretch; gap:14px;
    will-change: transform;
  }

  /* Cream pill cards */
  .t-card{
    flex:0 0 auto;
    min-width:320px; max-width:360px;
    background:linear-gradient(180deg,#fff9ec,#fdecd2);
    border:1.5px solid var(--rim);
    border-radius:var(--r-xl);
    padding:18px;
    box-shadow:var(--lift);
    display:flex; flex-direction:column; gap:10px;
    opacity:.35;                     /* default faded; JS raises near center */
    transform:scale(.96);
    transition: opacity .25s ease, transform .25s ease;
  }
  .t-card.is-center{
    opacity:1;
    transform:scale(1.02);
  }

  .t-stars{ display:inline-flex; gap:4px; }
  .t-stars svg{ width:18px; height:18px; }
  .t-quote{ margin:0; color:#0c2c41; font-weight:600; }
  .t-author{ margin:0; color:var(--muted); font-size:14px; }

  /* CTA strip */
  .review-cta{
    margin:28px auto 0; text-align:center;
    display:grid; gap:10px; justify-items:center;
  }
  .review-cta h3{ margin:0; font-family:"Playfair Display", serif; color:#0c2c41 }
  .review-btn{
    display:inline-block; font-weight:800; color:#1a4c74;
    background:linear-gradient(180deg,#fff9ec,#ffe7c1);
    border:1.5px solid var(--rim); border-radius:var(--r-pill);
    padding:12px 18px; text-decoration:none; box-shadow:var(--lift)
  }

  /* Simple 3-range sizing to match your site */
  @media (max-width:720px){
    .t-card{ min-width:82vw; max-width:82vw }
    .twrap{ --edge-fade: 40px; }
  }
  @media (min-width:721px) and (max-width:1170px){
    .t-card{ min-width:46vw; max-width:46vw }
    .twrap{ --edge-fade: 60px; }
  }
  @media (min-width:1280px){
    .t-card{ min-width:340px; max-width:340px }
  }

  /* Pause on hover/focus for accessibility */
  .twrap:hover .ttrack,
  .twrap:focus-within .ttrack{
    animation-play-state: paused;
  }

  /* Respect reduced motion: stop auto scroll + full opacity */
  @media (prefers-reduced-motion: reduce){
    .t-card{ opacity:1; transform:none }
  }
</style>
</head>

<script>
  // ===== Auto-scrolling, infinite loop, fade toward center (transform-based) =====
  (function(){
    const viewport = document.getElementById('tview');   // the visible window
    const track    = document.getElementById('ttrack');   // the moving strip
    const wrapper  = document.querySelector('.twrap');
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 1) Duplicate children once for seamless loop
    const items = Array.from(track.children);
    items.forEach(node => track.appendChild(node.cloneNode(true)));

    // 2) Animation state
    let x = 0;                 // current translateX
    let speed = 1;           // pixels per frame (tweak to taste)
    let rafId = null;

    // 3) Compute the width of a single set (half of the track after cloning)
    function singleSetWidth(){
      // After cloning, half of scrollWidth (approx). Using getBoundingClientRect is more reliable with transforms paused.
      const prev = track.style.transform;
      track.style.transform = 'translateX(0px)';   // neutralize while measuring
      const width = track.scrollWidth / 2;
      track.style.transform = prev || '';
      return width;
    }
    let loopWidth = 0;

    // 4) Fade/scale cards based on distance to the center of the viewport
    function highlightCenter(){
      const rectV = viewport.getBoundingClientRect();
      const centerX = rectV.left + rectV.width / 2;
      const cards = track.querySelectorAll('.t-card');

      cards.forEach(card => {
        const r = card.getBoundingClientRect(); // includes current transform
        const cardCenter = r.left + r.width / 2;
        const d = Math.abs(cardCenter - centerX);
        const maxD = rectV.width / 2; // half viewport
        const t = Math.max(0, Math.min(1, 1 - d / maxD));
        const op = 0.35 + t * 0.65;       // 0.35..1
        const scale = 0.96 + t * 0.06;    // .96..1.02
        card.style.opacity = op.toFixed(3);
        card.style.transform = `scale(${scale.toFixed(3)})`;
      });
    }

    // 5) Main loop
    function step(){
      x -= speed;
      if (-x >= loopWidth) {
        // When we’ve shifted by one full set, jump forward by that width
        x += loopWidth;
      }
      track.style.transform = `translateX(${x}px)`;
      highlightCenter();
      rafId = requestAnimationFrame(step);
    }

    // 6) Pause/resume on interactions & page visibility
    function pause(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }
    function resume(){ if (!rafId && !prefersReduced) rafId = requestAnimationFrame(step); }

    wrapper.addEventListener('mouseleave', resume);

    wrapper.addEventListener('focusout', resume);
    window.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
    window.addEventListener('resize', () => { 
      // Recompute loop width & snap transform to keep things seamless

    
      loopWidth = singleSetWidth();
      // Keep x within [-loopWidth, 0]
      x = ((x % loopWidth) + loopWidth) % loopWidth * -1;
      track.style.transform = `translateX(${x}px)`;
      highlightCenter();
      if (!wasPaused) resume();
    });

    // 7) Kickoff
    loopWidth = singleSetWidth();
    track.style.willChange = 'transform';
    highlightCenter();
    if (!prefersReduced) resume();

    // Year
    document.getElementById('y').textContent = new Date().getFullYear();
  })();
</script>
